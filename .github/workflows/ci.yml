# CI (from P0; test job wired to native libraries and media in P1; plugin natives in P4): build and test on Windows, macOS and
# Linux, publish self-contained apps for all six runtime identifiers, build/fetch the native libraries (FFmpeg, miniaudio,
# SoundTouch, libopenmpt), fetch the plugin assets (GeneralUser GS SoundFont, OptimFROG libraries) and generate the test media.
# Note: OptimFROG exists for x64 only, so its tests are skipped on the macOS arm64 runner by design.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    # Decoder (FM-01) and output (PB-04) tests need the native libraries and the generated media; without them they
    # are skipped, so this job waits for both and downloads them.
    needs: [native, plugin-assets, test-media]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/native
      - uses: actions/download-artifact@v4
        with:
          name: libopenmpt-${{ matrix.rid }}
          path: native/out/libopenmpt/runtimes/${{ matrix.rid }}/native
      - uses: actions/download-artifact@v4
        with:
          name: plugin-assets
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: tests/media/generated
      - run: dotnet restore AudioTastic.slnx
      - run: dotnet build AudioTastic.slnx -c Release --no-restore
      # xunit v3 on Microsoft.Testing.Platform (global.json "test.runner").
      - run: dotnet test AudioTastic.slnx -c Release --no-build --results-directory TestResults --report-xunit-trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/native
      - uses: actions/download-artifact@v4
        with:
          name: libopenmpt-${{ matrix.rid }}
          path: native/out/libopenmpt/runtimes/${{ matrix.rid }}/native
      - uses: actions/download-artifact@v4
        with:
          name: plugin-assets
          path: native
      - run: dotnet publish src/AudioTastic.App/AudioTastic.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTastic-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  native:
    name: Native libraries (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, cmake_arch: "-A x64" }
          - { os: windows-latest, rid: win-arm64, cmake_arch: "-A ARM64" }
          - { os: macos-latest, rid: osx-arm64, cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=arm64" }
          - { os: macos-latest, rid: osx-x64, cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
          - { os: ubuntu-latest, rid: linux-x64, cmake_arch: "" }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, cmake_arch: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg (prebuilt LGPL)
        if: ${{ !startsWith(matrix.rid, 'osx') }}
        run: python native/fetch_ffmpeg.py --rid ${{ matrix.rid }}
      - name: FFmpeg (built from source, LGPL)
        if: ${{ startsWith(matrix.rid, 'osx') }}
        run: bash native/build_ffmpeg_macos.sh ${{ matrix.rid == 'osx-arm64' && 'arm64' || 'x86_64' }}
      - name: miniaudio and SoundTouch
        run: |
          cmake -S native -B native/build/${{ matrix.rid }} -DCMAKE_BUILD_TYPE=Release -DAT_RID=${{ matrix.rid }} ${{ matrix.cmake_arch }}
          cmake --build native/build/${{ matrix.rid }} --config Release
          cmake --install native/build/${{ matrix.rid }} --config Release
      - name: libopenmpt (prebuilt, FM-07)
        if: ${{ startsWith(matrix.rid, 'win') }}
        run: python native/fetch_libopenmpt.py --rid ${{ matrix.rid }}
      - name: libopenmpt (built from source, FM-07)
        if: ${{ !startsWith(matrix.rid, 'win') }}
        run: bash native/build_libopenmpt_unix.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/native
      - uses: actions/upload-artifact@v4
        with:
          name: libopenmpt-${{ matrix.rid }}
          path: native/out/libopenmpt/runtimes/${{ matrix.rid }}/native

  plugin-assets:
    name: Plugin assets (SoundFont, OptimFROG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 native/fetch_soundfont.py
      # OptimFROG: losslessaudio.org no longer serves the packages (404, Nov 2026); the plugin becomes a separate download
      # hosted with our releases, and its tests are skipped here until CI fetches it from there.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-assets
          path: native/downloads/soundfont

  test-media:
    name: Test media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The .ofr test files need the OptimFROG encoder (local only; see the plugin-assets job).
      - run: python3 scripts/generate_test_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: tests/media/generated
